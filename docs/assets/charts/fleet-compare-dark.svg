<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" width="800" height="374" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-label="Python HTTP servers one node holds, by runtime">
<rect width="800" height="374" rx="12" fill="#1a1a19"/>
<text x="24.0" y="40.0" font-size="18" font-weight="600" fill="#f0efec" text-anchor="start">Python HTTP servers one 2-core, 2 GB node holds</text>
<text x="24.0" y="64.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Kept in memory until 512 MiB is left; median of 12 runs on 6 nodes. Log scale.</text>
<line x1="270.0" x2="270.0" y1="96" y2="330" stroke="#383835"/>
<text x="270.0" y="348.0" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">10</text>
<line x1="426.7" x2="426.7" y1="96" y2="330" stroke="#262624"/>
<text x="426.7" y="348.0" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">100</text>
<line x1="583.3" x2="583.3" y1="96" y2="330" stroke="#262624"/>
<text x="583.3" y="348.0" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">1,000</text>
<line x1="740.0" x2="740.0" y1="96" y2="330" stroke="#262624"/>
<text x="740.0" y="348.0" font-size="12" font-weight="400" fill="#898781" text-anchor="middle">10,000</text>
<text x="258.0" y="119.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">Plain process, no isolation</text>
<rect x="270" y="107" width="154.2" height="18" rx="4" fill="#898781"/>
<text x="432.2" y="120.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">96</text>
<text x="258.0" y="153.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">bubblewrap</text>
<rect x="270" y="141" width="152.1" height="18" rx="4" fill="#898781"/>
<text x="430.1" y="154.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">94</text>
<text x="258.0" y="187.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">Podman (crun)</text>
<rect x="270" y="175" width="147.6" height="18" rx="4" fill="#898781"/>
<text x="425.6" y="188.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">88</text>
<text x="258.0" y="221.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">Docker (runc)</text>
<rect x="270" y="209" width="121.9" height="18" rx="4" fill="#898781"/>
<text x="399.9" y="222.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">60</text>
<text x="258.0" y="255.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">Docker + gVisor</text>
<rect x="270" y="243" width="78.1" height="18" rx="4" fill="#898781"/>
<text x="356.1" y="256.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">32</text>
<text x="258.0" y="289.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="end">Sandstorm, every sandbox awake</text>
<rect x="270" y="277" width="106.3" height="18" rx="4" fill="#3987e5"/>
<text x="384.3" y="290.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">48</text>
<text x="258.0" y="323.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="end">Sandstorm, idle ones tiered, all callable</text>
<rect x="270" y="311" width="395.3" height="18" rx="4" fill="#d95926"/>
<text x="673.3" y="324.0" font-size="12" font-weight="600" fill="#f0efec" text-anchor="start">3,333</text>
