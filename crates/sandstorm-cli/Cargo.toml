[package]
name = "sandstorm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sandstorm"
path = "src/main.rs"

[dependencies]
sandstorm-vmm = { path = "../sandstorm-vmm" }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Snapshot Hub (`sandstorm pack` / `unpack` / `pull` / `images`).
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
toml = "0.8"
ureq = "2"

# `sandstorm doctor` uses statvfs(3) for snapshot-dir free-space check.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# v0.4 wp-bench subcommand uses the snapshot-side UFFD_WP machinery
# from sandstorm-uffd. Linux-only because UFFD_WP doesn't exist on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
sandstorm-uffd = { path = "../sandstorm-uffd" }

[dev-dependencies]
tempfile = "3"
