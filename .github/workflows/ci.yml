name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: both jobs only check out and test, so the default token
# -- which can carry write scope -- is more than they need. CodeQL's
# actions/missing-workflow-permissions flagged every job here.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --all
      - name: cargo test
        run: cargo test --all

  agent-python:
    # sandstorm-agent.py unit + stream tests. sandstorm-agent runs as PID 1 inside
    # guest VMs; these exercise the pure-Python protocol logic (container-env
    # PATH handling, BufferedLineReader coalesced-frame handling, stream
    # lifecycle + process-group descendant cleanup) with no sandbox runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: agent env + stream tests
        working-directory: rootfs-init
        run: |
          python tests/test_agent_env.py
          python tests/test_agent_stream.py

  sdk-python:
    # SDK unit tests that need no sandbox runtime/daemon — target parsing
    # and the _send wire protocol against an in-process socket server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install + pytest
        working-directory: sdk/python
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet -e .
          python -m pytest tests/ -q

  mcp-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp:
          - 'mcp==1.2.0'
          # Deliberately tracks the latest compatible 1.x as an early warning.
          - 'mcp>=1.2,<2'
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7, so this
      # one is pinned to an exact release while the rest track majors.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: stdio handshake
        env:
          MCP: ${{ matrix.mcp }}
        run: |
          pins=()
          # mcp 1.2.0 imports pydantic._internal._typing_extra.eval_type_backport,
          # which pydantic 2.14.0 (2026-10-08) removed. Hold pydantic back on the
          # floor leg only, so the tracking leg still surfaces real breakage.
          if [[ "$MCP" == "mcp==1.2.0" ]]; then
            pins+=(--with 'pydantic<2.14')
          fi
          uv run --isolated --no-project \
            --with-editable ./sdk/mcp \
            --with anyio \
            --with pytest \
            --with "$MCP" "${pins[@]}" \
            pytest -q sdk/mcp/tests/test_stdio.py
