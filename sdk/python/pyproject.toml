[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandstorm-sdk"
version = "0.5.3"
description = "Python client for Sandstorm: gVisor and Firecracker sandboxes across a fleet of nodes (E2B-compatible surface)"
readme = "README.md"
authors = [{name = "Deeplethe", email = "info@deeplethe.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["sandbox", "gvisor", "firecracker", "fork", "ai-agents"]

[project.urls]
Homepage = "https://github.com/deeplethe/sandstorm"
Source = "https://github.com/deeplethe/sandstorm"
Issues = "https://github.com/deeplethe/sandstorm/issues"

[tool.setuptools]
packages = ["sandstorm"]
