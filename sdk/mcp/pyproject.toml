[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandstorm-mcp"
version = "0.2.1"
description = "Model Context Protocol server for Sandstorm: gVisor and Firecracker sandboxes across a fleet of nodes"
readme = "README.md"
authors = [{name = "Deeplethe", email = "info@deeplethe.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "sandstorm", "sandbox", "ai-agents", "gvisor", "firecracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/deeplethe/sandstorm"
Source = "https://github.com/deeplethe/sandstorm/tree/main/sdk/mcp"
Issues = "https://github.com/deeplethe/sandstorm/issues"

[project.scripts]
sandstorm-mcp = "sandstorm_mcp.server:main"

[tool.setuptools]
packages = ["sandstorm_mcp"]
